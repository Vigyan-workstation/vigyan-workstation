name: Vigyan Workstation CI & Air-Gap Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify Build, Tests & Air-Gap Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest sympy psutil pillow kuzu anyio

      - name: Setup Bun (Frontend Runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Svelte 5 Frontend
        run: |
          cd frontend
          bun install
          bun run build

      - name: Run Pytest Suite
        run: |
          xvfb-run -a pytest tests/

      - name: Air-Gap Zero-Egress Audit
        run: |
          if grep -E 'https?://(cdn|fonts\.googleapis|unpkg|cdnjs)' frontend/index.html src/dist/index.html; then
            echo "ERROR: Remote CDN detected. Violates 100% Air-Gapped Zero-Cloud Guarantee."
            exit 1
          fi
          echo "SUCCESS: 100% Air-Gapped compliance verified."
