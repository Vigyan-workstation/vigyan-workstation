name: Build and Release Vigyan Pro Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.0)'
        required: false
        default: '2.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            CLEAN_VER="${{ github.event.inputs.version }}"
            CLEAN_VER="${CLEAN_VER#v}"
            echo "VERSION=${CLEAN_VER}" >> $GITHUB_OUTPUT
            echo "TAG_NAME=v${CLEAN_VER}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            CLEAN_VER="${TAG#v}"
            echo "VERSION=${CLEAN_VER}" >> $GITHUB_OUTPUT
            echo "TAG_NAME=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build Release Packages (.deb & .tar.gz)
        run: |
          chmod +x package.sh
          ./package.sh "${{ steps.get_version.outputs.VERSION }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: "Vigyan Pro Desktop ${{ steps.get_version.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/vigyan-pro_*.deb
            dist/vigyan-pro_*.tar.gz
